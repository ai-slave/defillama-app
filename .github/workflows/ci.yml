name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check lint baseline is tight
        run: |
          git fetch --no-tags --depth=1 origin main
          bun run lint:baseline:check -- --base origin/main

      - name: Check React Compiler baseline is tight
        # A component that stops compiling is invisible otherwise: nothing fails, it just stops being
        # memoized. The baseline records what still bails so everything else is protected.
        # Fetches main itself: without the ref the base comparison skips silently.
        run: |
          git fetch --no-tags --depth=1 origin main
          bun run compiler:baseline:check -- --base origin/main

      - name: Check number-formatting policy
        run: bun scripts/policies/check-number-formatting.ts

      - name: Check date-formatting policy
        run: bun scripts/policies/check-date-formatting.ts --self-test && bun scripts/policies/check-date-formatting.ts

      - name: Check design-token policy
        run: bun scripts/policies/check-design-tokens.mjs

      - name: Prepare build artifacts
        # Runs metadata pull, dataset cache, llms.txt, and robots.txt via build:metadata.
        # Requires secrets.API_KEY so production metadata refresh can run; do not set NODE_ENV=development here
        # or failed upstream pulls would write stubs and hide breakage.
        run: bun run build:metadata
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck test files
        run: bun run test:typecheck

      - name: Run tests
        run: bun run test
