name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check React Compiler baseline is tight
        # A component that stops compiling is invisible otherwise: nothing fails, it just stops being
        # memoized. The baseline records what still bails so everything else is protected.
        # Fetches main itself: without the ref the base comparison skips silently.
        run: |
          git fetch --no-tags --depth=1 origin main
          bun run compiler:baseline:check -- --base origin/main

      - name: Check number-formatting policy
        run: bun scripts/policies/check-number-formatting.ts

      - name: Check date-formatting policy
        run: bun scripts/policies/check-date-formatting.ts --self-test && bun scripts/policies/check-date-formatting.ts

      - name: Check hydration policy
        run: bun scripts/policies/check-hydration.ts --self-test && bun scripts/policies/check-hydration.ts

      - name: Check column picker policy
        run: bun scripts/policies/check-column-pickers.ts --self-test && bun scripts/policies/check-column-pickers.ts

      - name: Check chart export policy
        run: bun scripts/policies/check-chart-exports.ts --self-test && bun scripts/policies/check-chart-exports.ts

      - name: Check image size policy
        run: bun scripts/policies/check-image-size.ts --self-test && bun scripts/policies/check-image-size.ts

      - name: Check table data identity policy
        run: bun scripts/policies/check-table-data-identity.ts --self-test && bun scripts/policies/check-table-data-identity.ts

      - name: Check focus handoff policy
        run: bun scripts/policies/check-focus-handoff.ts --self-test && bun scripts/policies/check-focus-handoff.ts

      - name: Check status parts policy
        run: bun scripts/policies/check-status-parts.ts --self-test && bun scripts/policies/check-status-parts.ts

      - name: Check part classes policy
        run: bun scripts/policies/check-part-classes.ts --self-test && bun scripts/policies/check-part-classes.ts

      - name: Check form validation policy
        run: bun scripts/policies/check-form-validation.ts --self-test && bun scripts/policies/check-form-validation.ts

      - name: Check design-token policy
        run: bun scripts/policies/check-design-tokens.mjs

      - name: Check color contrast policy
        run: bun scripts/policies/check-color-contrast.mjs

      - name: Prepare build artifacts
        # Runs metadata pull, dataset cache, llms.txt, and robots.txt via build:metadata.
        # Requires secrets.API_KEY so production metadata refresh can run; do not set NODE_ENV=development here
        # or failed upstream pulls would write stubs and hide breakage.
        run: bun run build:metadata
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck test files
        run: bun run test:typecheck

  # Split from `checks` so the suite runs alongside it instead of after it, and
  # sharded because one runner needs ~9 minutes for 970 files. Tests do not need
  # build:metadata: the only test reading a generated file generates it itself.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Report every shard's failures, not just the first to fail.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Transformed modules from the latest main run of this shard. Entries are keyed by file content,
      # so a partial match is still correct; the lockfile hash in the key starts a fresh cache whenever
      # dependencies change, which is also when Vitest would discard it.
      - name: Restore module cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-${{ matrix.shard }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: vitest-modules-${{ matrix.shard }}-${{ hashFiles('bun.lock') }}-

      - name: Run tests
        run: bun run test -- --shard=${{ matrix.shard }}/4

      # Only main saves, so pull requests read one shared cache instead of each writing their own.
      - name: Save module cache
        if: github.event_name == 'push' && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-${{ matrix.shard }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
